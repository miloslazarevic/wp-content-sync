name: uic
label: "UIC Business"

site:
  # Path to the Local.app site's WordPress root (contains wp-config.php).
  wp_path: "~/Local Sites/uic-business/app/public"

database:
  # Supply EXACTLY ONE of socket or host+port.
  # Find both in Local.app -> select site -> Database tab.
  socket: "~/Library/Application Support/Local/run/JATepPm5D/mysql/mysqld.sock"
  # host: 127.0.0.1
  # port: 10005

  # Optional overrides. Normally omitted -- the runner reads these from wp-config.php.
  # name: local
  # user: root
  # password: root
  # table_prefix: wp_

dump:
  post_types: [page]
  post_status: [publish, draft]
  include: []        # list of page paths (no leading/trailing slash); empty = all
  exclude: []         # list of page paths to skip, same format as include

  # 14 of these 29 pages have empty post_content -- built entirely with
  # ACF/flexible-content fields in postmeta instead (see clients/uic/CLAUDE.md,
  # PLAN.md §11). They're still listed here and in summary.html/pages.csv; dump
  # just doesn't write a current/<path>.html for them since there's nothing in
  # post_content to write.
